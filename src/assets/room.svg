<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#28304a"/>
      <stop offset="1" stop-color="#1a2036"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161c30"/>
      <stop offset="1" stop-color="#0d1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ffbe83" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#c78bff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#c78bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd08a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffd08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="poster1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fe0d0"/>
      <stop offset="1" stop-color="#8b6dff"/>
    </linearGradient>
    <linearGradient id="poster2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5b13c"/>
      <stop offset="1" stop-color="#ef6a52"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- walls + floor -->
  <rect x="0" y="0" width="1600" height="660" fill="url(#wall)"/>
  <rect x="0" y="620" width="1600" height="280" fill="url(#floor)"/>
  <!-- perspective floor lines (depth) -->
  <g stroke="#38436a" stroke-width="2" opacity="0.35">
    <line x1="0" y1="900" x2="640" y2="632"/>
    <line x1="420" y1="900" x2="720" y2="632"/>
    <line x1="1600" y1="900" x2="960" y2="632"/>
    <line x1="1180" y1="900" x2="880" y2="632"/>
  </g>

  <!-- ceiling shadow (encloses the room from the top) -->
  <polygon points="0,0 1600,0 1400,124 200,124" fill="#0c1020" opacity="0.6"/>

  <!-- warm ambient glow behind the TV -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#glow)"/>

  <!-- neon accent strips on the back wall -->
  <rect x="120" y="120" width="360" height="8" rx="4" fill="#3fe0d0" filter="url(#neon)"/>
  <rect x="120" y="120" width="360" height="6" rx="3" fill="#8affee"/>
  <rect x="1120" y="150" width="360" height="8" rx="4" fill="#a07dff" filter="url(#neon)"/>
  <rect x="1120" y="150" width="360" height="6" rx="3" fill="#c9b6ff"/>

  <!-- framed posters -->
  <g>
    <rect x="150" y="200" width="180" height="240" rx="10" fill="#0e1322" stroke="#454f70" stroke-width="6"/>
    <rect x="166" y="216" width="148" height="208" rx="6" fill="url(#poster1)" opacity="0.9"/>
    <rect x="1270" y="230" width="180" height="240" rx="10" fill="#0e1322" stroke="#454f70" stroke-width="6"/>
    <rect x="1286" y="246" width="148" height="208" rx="6" fill="url(#poster2)" opacity="0.9"/>
  </g>

  <!-- rug under the TV -->
  <ellipse cx="800" cy="760" rx="520" ry="70" fill="#2a3352" opacity="0.7"/>
  <ellipse cx="800" cy="760" rx="520" ry="70" fill="none" stroke="#3fe0d0" stroke-width="3" opacity="0.35"/>
  <!-- soft screen-light spill on the floor -->
  <ellipse cx="800" cy="702" rx="320" ry="48" fill="#ffbe83" opacity="0.12" filter="url(#soft)"/>

  <!-- left console + plant + books -->
  <g>
    <rect x="60" y="560" width="300" height="26" rx="8" fill="#2c2536"/>
    <rect x="80" y="586" width="20" height="120" fill="#241f2e"/>
    <rect x="320" y="586" width="20" height="120" fill="#241f2e"/>
    <!-- plant pot -->
    <path d="M150 560 L210 560 L200 510 L160 510 Z" fill="#b5763f"/>
    <!-- leaves -->
    <path d="M180 510 C150 470 150 420 172 380 C186 430 186 480 180 510 Z" fill="#43b783"/>
    <path d="M180 512 C210 476 224 430 214 388 C190 428 176 476 180 512 Z" fill="#369c6d"/>
    <path d="M180 514 C160 486 140 470 118 466 C144 492 164 508 180 514 Z" fill="#4ec793"/>
    <!-- book stack -->
    <rect x="250" y="536" width="86" height="16" rx="3" fill="#e06a52"/>
    <rect x="256" y="520" width="80" height="16" rx="3" fill="#f0b23f"/>
    <rect x="248" y="504" width="78" height="16" rx="3" fill="#3fb6ab"/>
  </g>

  <!-- right floor lamp -->
  <g>
    <circle cx="1440" cy="430" r="150" fill="url(#lampGlow)"/>
    <rect x="1432" y="470" width="16" height="240" rx="6" fill="#2c3350"/>
    <path d="M1400 470 L1480 470 L1462 396 L1418 396 Z" fill="#ffce85"/>
    <ellipse cx="1440" cy="712" rx="70" ry="16" fill="#232a45"/>
  </g>

  <!-- soft edge vignette for depth -->
  <rect x="0" y="0" width="1600" height="900" fill="#0a0d18" opacity="0"/>
  <radialGradient id="vig" cx="0.5" cy="0.46" r="0.75">
    <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#05070e" stop-opacity="0.55"/>
  </radialGradient>
  <rect x="0" y="0" width="1600" height="900" fill="url(#vig)"/>
</svg>
