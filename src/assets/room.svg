<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1913"/>
      <stop offset="1" stop-color="#100d09"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15110b"/>
      <stop offset="1" stop-color="#0b0805"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#e8bd34" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#dcae1e" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#dcae1e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd483" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd483" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="poster1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0cc5c"/>
      <stop offset="1" stop-color="#74590f"/>
    </linearGradient>
    <linearGradient id="poster2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcae1e"/>
      <stop offset="1" stop-color="#3a2d07"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- walls + floor -->
  <rect x="0" y="0" width="1600" height="660" fill="url(#wall)"/>
  <rect x="0" y="620" width="1600" height="280" fill="url(#floor)"/>
  <!-- perspective floor lines (depth) -->
  <g stroke="#4a4030" stroke-width="2" opacity="0.35">
    <line x1="0" y1="900" x2="640" y2="632"/>
    <line x1="420" y1="900" x2="720" y2="632"/>
    <line x1="1600" y1="900" x2="960" y2="632"/>
    <line x1="1180" y1="900" x2="880" y2="632"/>
  </g>

  <!-- ceiling shadow (encloses the room from the top) -->
  <polygon points="0,0 1600,0 1400,124 200,124" fill="#0b0805" opacity="0.6"/>

  <!-- warm ambient glow behind the TV -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#glow)"/>

  <!-- golden neon accent strips on the back wall -->
  <rect x="120" y="120" width="360" height="8" rx="4" fill="#dcae1e" filter="url(#neon)"/>
  <rect x="120" y="120" width="360" height="6" rx="3" fill="#ffe08a"/>
  <rect x="1120" y="150" width="360" height="8" rx="4" fill="#dcae1e" filter="url(#neon)"/>
  <rect x="1120" y="150" width="360" height="6" rx="3" fill="#ffe08a"/>

  <!-- framed posters -->
  <g>
    <rect x="150" y="200" width="180" height="240" rx="10" fill="#0e0b07" stroke="#4a4030" stroke-width="6"/>
    <rect x="166" y="216" width="148" height="208" rx="6" fill="url(#poster1)" opacity="0.85"/>
    <rect x="1270" y="230" width="180" height="240" rx="10" fill="#0e0b07" stroke="#4a4030" stroke-width="6"/>
    <rect x="1286" y="246" width="148" height="208" rx="6" fill="url(#poster2)" opacity="0.85"/>
  </g>

  <!-- rug under the TV -->
  <ellipse cx="800" cy="760" rx="520" ry="70" fill="#241f16" opacity="0.8"/>
  <ellipse cx="800" cy="760" rx="520" ry="70" fill="none" stroke="#dcae1e" stroke-width="3" opacity="0.32"/>
  <!-- soft screen-light spill on the floor -->
  <ellipse cx="800" cy="702" rx="320" ry="48" fill="#e8bd34" opacity="0.12" filter="url(#soft)"/>

  <!-- left console + plant + books -->
  <g>
    <rect x="60" y="560" width="300" height="26" rx="8" fill="#241f16"/>
    <rect x="80" y="586" width="20" height="120" fill="#1a160f"/>
    <rect x="320" y="586" width="20" height="120" fill="#1a160f"/>
    <!-- plant pot -->
    <path d="M150 560 L210 560 L200 510 L160 510 Z" fill="#8a6a3a"/>
    <!-- leaves (muted olive) -->
    <path d="M180 510 C150 470 150 420 172 380 C186 430 186 480 180 510 Z" fill="#7a8348"/>
    <path d="M180 512 C210 476 224 430 214 388 C190 428 176 476 180 512 Z" fill="#5f6a38"/>
    <path d="M180 514 C160 486 140 470 118 466 C144 492 164 508 180 514 Z" fill="#8b9455"/>
    <!-- book stack (black-yellow tones) -->
    <rect x="250" y="536" width="86" height="16" rx="3" fill="#dcae1e"/>
    <rect x="256" y="520" width="80" height="16" rx="3" fill="#9a7714"/>
    <rect x="248" y="504" width="78" height="16" rx="3" fill="#4a463d"/>
  </g>

  <!-- right floor lamp -->
  <g>
    <circle cx="1440" cy="430" r="150" fill="url(#lampGlow)"/>
    <rect x="1432" y="470" width="16" height="240" rx="6" fill="#2a2419"/>
    <path d="M1400 470 L1480 470 L1462 396 L1418 396 Z" fill="#f0cc5c"/>
    <ellipse cx="1440" cy="712" rx="70" ry="16" fill="#1c1811"/>
  </g>

  <!-- soft edge vignette for depth -->
  <radialGradient id="vig" cx="0.5" cy="0.46" r="0.75">
    <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#050402" stop-opacity="0.58"/>
  </radialGradient>
  <rect x="0" y="0" width="1600" height="900" fill="url(#vig)"/>
</svg>
